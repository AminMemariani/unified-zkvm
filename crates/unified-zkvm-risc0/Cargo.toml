[workspace]

[package]
name = "unified-zkvm-risc0"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "RISC Zero backend adapter for unified-zkvm."

[dependencies]
unified-zkvm-core = { path = "../unified-zkvm-core", features = ["std"] }
risc0-zkvm = { version = "3.0.6", default-features = false, features = ["client", "prove", "std"] }
bincode = "1.3"
