[package]
name = "unified-zkvm-sp1"
description = "Succinct SP1 backend adapter for unified-zkvm."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Published with a version as well as a path: crates.io rejects path-only
# dependencies, and the path keeps local workspace builds using the in-tree
# crate rather than the registry copy.
unified-zkvm-core = { workspace = true, features = ["std"] }
sp1-sdk = { version = "6.8.0", features = ["blocking"] }
bincode = "1.3.3"

[package.metadata.docs.rs]
# docs.rs cannot build the SP1 SDK: its build scripts require `protoc`, which is
# not available in the docs.rs sandbox. Documenting this crate there would fail,
# so point readers at the repository instead.
no-default-features = true
