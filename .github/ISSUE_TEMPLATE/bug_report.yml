name: Bug report
description: Something in unified-zkvm behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug. Please do not report security issues here - see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the error message or incorrect behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code or steps. A failing `cargo test --workspace` case is ideal.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - mock (development backend)
        - SP1
        - RISC Zero
        - not backend specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: unified-zkvm version
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Rust toolchain and OS
      description: "Output of `rustc -vV` plus your OS. MSRV is 1.85."
    validations:
      required: true
