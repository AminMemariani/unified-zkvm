[package]
name = "typed-io-example"
description = "Typed host/guest I/O through the canonical codec: nested structs, Option, Vec and fixed arrays."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
unified-zkvm-core = { workspace = true, features = ["std"] }
unified-zkvm-host = { workspace = true }
unified-zkvm-mock = { workspace = true }
unified-zkvm-tests = { path = "../../tests" }
serde = { workspace = true, features = ["std", "derive"] }
postcard = { workspace = true, features = ["use-std"] }
anyhow = { workspace = true }
